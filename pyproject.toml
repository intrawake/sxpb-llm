[project]
name = "sxpb-llm"
version = "0.1.0"
description = "Shared LLM calling, model definition parsing, and SxPB extraction utilities."
authors = [
    {name = "paprika-bot", email = "sockpaprika-git@intrawake.com"},
]
license = {text = "0BSD"}
dependencies = [
    "sxpb @ git+https://github.com/sxproto/sxpb-py@04c9bbe867eaacf5bda92f4ee777e9f8fcb2992a",
    "httpx2>=2.5.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
async = ["httpx2>=0.24"]

[project.scripts]
sxpb-rag = "sxpb_llm.rag.cli:main"

[tool.pdm.dev-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "ty",
]

[tool.pdm.scripts]
check-format = "ruff check"
check-type = "ty check"
tidy = "ruff format"
lint = {composite = ["check-format", "check-type"]}
test = "pytest -q"
tidytest = {composite = ["test", "tidy", "lint"]}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.ty.environment]
root = ["src", "test", "."]
