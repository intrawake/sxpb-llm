[project]
name = "sxpb-llm"
version = "0.1.0"
description = "Shared LLM calling, model definition parsing, and SxPB extraction utilities."
authors = [
    {name = "paprika-bot", email = "sockpaprika-git@intrawake.com"},
]
license = {text = "0BSD"}
dependencies = [
    "sxpb @ git+https://github.com/sxproto/sxpb-py@3a84ab22bec2d10734f7eb6dba8ffce09eb1a650",
    "httpx2>=2.5.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
async = ["httpx2>=0.24"]

[project.scripts]
sxpb-rag = "sxpb_llm.rag.cli:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "ty",
]

[tool.pdm.scripts]
check-format = "ruff check"
check-type = "ty check"
lint-sxpb = "sxpb-lint --ignore-file .gitignore"
tidy-python = "ruff format"
tidy-sxpb = "sxpb-tidy --ignore-file .gitignore"
tidy = {composite = ["tidy-python", "tidy-sxpb"]}
lint = {composite = ["check-format", "check-type", "lint-sxpb"]}
test = "pytest -q"
tidytest = {composite = ["tidy", "lint", "test"]}

[tool.ty.environment]
root = ["src", "test", "."]
